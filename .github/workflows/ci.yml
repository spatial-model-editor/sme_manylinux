name: CI
on: push

jobs:
  manylinux:
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: "ubuntu-22.04"
            arch: "x86_64"
          - os: "ubuntu-22.04-arm"
            arch: "aarch64"
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      PUSH_IMAGE: ${{ github.repository == 'spatial-model-editor/sme_manylinux' && github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: ARCH=${{ matrix.platform.arch }}
          tags: ghcr.io/spatial-model-editor/manylinux_${{ matrix.platform.arch }}:${{ github.ref_name }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          cache-from: type=gha,scope=${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform.arch }}
